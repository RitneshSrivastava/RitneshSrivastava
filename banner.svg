<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="40%" style="stop-color:#1a1040"/>
      <stop offset="80%" style="stop-color:#0c2340"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.4"/>
      <stop offset="50%" style="stop-color:#a78bfa;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:0.4"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="50%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#38bdf8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bg)" rx="12"/>

  <!-- Decorative wave at top -->
  <path d="M0,60 C150,20 300,80 450,50 C600,20 750,70 900,40 L900,0 L0,0 Z" fill="url(#wave1)" opacity="0.3"/>

  <!-- Decorative wave at bottom -->
  <path d="M0,160 C200,140 350,180 500,155 C650,130 800,170 900,150 L900,200 L0,200 Z" fill="url(#wave1)" opacity="0.3"/>

  <!-- Dots decoration -->
  <circle cx="50" cy="100" r="2" fill="#58a6ff" opacity="0.6"/>
  <circle cx="80" cy="60" r="1.5" fill="#a78bfa" opacity="0.5"/>
  <circle cx="30" cy="140" r="1.5" fill="#38bdf8" opacity="0.5"/>
  <circle cx="850" cy="100" r="2" fill="#58a6ff" opacity="0.6"/>
  <circle cx="820" cy="60" r="1.5" fill="#a78bfa" opacity="0.5"/>
  <circle cx="870" cy="140" r="1.5" fill="#38bdf8" opacity="0.5"/>
  <circle cx="120" cy="170" r="1" fill="#58a6ff" opacity="0.4"/>
  <circle cx="780" cy="170" r="1" fill="#a78bfa" opacity="0.4"/>
  <circle cx="450" cy="20" r="1.5" fill="#38bdf8" opacity="0.5"/>

  <!-- Main Name -->
  <text x="450" y="90" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="42" font-weight="700" fill="url(#textGrad)" filter="url(#glow)">Ritnesh Srivastava</text>

  <!-- Subtitle line 1 -->
  <text x="450" y="128" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#8b949e" letter-spacing="1">Backend Engineer  ⚡  Java &amp; Spring Boot  ⚡  AI Systems</text>

  <!-- Bottom tag -->
  <text x="450" y="170" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#30363d">Building scalable production systems · Open to opportunities</text>
</svg>
